name: Build Clean Upload ZIP

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WordPress-ready plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package bubbahub-directory-wordpress-ready.zip
          mkdir -p package/directory
          rsync -a --exclude='.git' --exclude='.github' --exclude='package' ./ package/directory/

          test -f package/directory/directory.php
          test -f package/directory/modules/core/bubbahub-advanced-search.php
          test -f package/directory/myhub/myhub-v2.php
          test -f package/directory/myhub/myhub-weekly-planner-v2.php

          echo "Packaging directory contents:"
          find package/directory -type f | wc -l

          cd package
          set +e
          zip -r ../bubbahub-directory-wordpress-ready.zip directory
          zip_rc=$?
          set -e
          echo "zip exit code: $zip_rc"
          if [ "$zip_rc" -ne 0 ]; then
            exit "$zip_rc"
          fi

          echo "Testing ZIP integrity:"
          unzip -t ../bubbahub-directory-wordpress-ready.zip
          echo "ZIP size:"
          ls -lh ../bubbahub-directory-wordpress-ready.zip

      - name: Upload WordPress-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bubbahub-directory-wordpress-ready
          path: bubbahub-directory-wordpress-ready.zip
          if-no-files-found: error
