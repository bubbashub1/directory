name: BubbaHub PHP lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        shell: bash
        run: |
          set -e
          files=$(find . -type f -name '*.php' -not -path './vendor/*')
          for file in $files; do
            php -l "$file" >/dev/null
          done
          echo "PHP syntax check passed for all PHP files."
