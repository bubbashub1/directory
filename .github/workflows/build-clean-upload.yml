name: Build Clean Upload ZIP

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WordPress-ready plugin ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f bubbahub-directory-wordpress-ready.zip

          git archive             --format=zip             --prefix=directory/             -o bubbahub-directory-wordpress-ready.zip             HEAD             -- . ':(exclude).github' ':(exclude)package'

          test -s bubbahub-directory-wordpress-ready.zip

          unzip -t bubbahub-directory-wordpress-ready.zip

          unzip -l bubbahub-directory-wordpress-ready.zip | grep -F 'directory/directory.php'
          unzip -l bubbahub-directory-wordpress-ready.zip | grep -F 'directory/modules/core/bubbahub-advanced-search.php'
          unzip -l bubbahub-directory-wordpress-ready.zip | grep -F 'directory/myhub/myhub-v2.php'
          unzip -l bubbahub-directory-wordpress-ready.zip | grep -F 'directory/myhub/myhub-weekly-planner-v2.php'

          if unzip -l bubbahub-directory-wordpress-ready.zip | grep -q '^.* directory/.github/'; then
            echo 'ERROR: .github files were included in the deployment ZIP'
            exit 1
          fi

          echo 'WordPress-ready ZIP validated successfully'
          ls -lh bubbahub-directory-wordpress-ready.zip

      - name: Upload WordPress-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bubbahub-directory-wordpress-ready
          path: bubbahub-directory-wordpress-ready.zip
          if-no-files-found: error
